          description: This is the last update of the data record in the system.
          format: timestamp with time zone
          type: string
        retrieved_timestamp:
          description: This is the timestamp of a retrieval or transmission (e.g.
            responding to an API call).
          format: timestamp with time zone
          type: string
      type: object
