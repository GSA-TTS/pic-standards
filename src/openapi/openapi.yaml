  schemas:
    legal_structure:
      description: Legal, policy, or process data guiding the NEPA process, including
        thresholds and conditions for level of reviews or other decision
        criteria.
      required:
        - id
        - created_at
      properties:
        id:
          description: |-
            database id

            Note:
            This is a Primary Key.<pk/>
          format: bigint
          type: integer
        created_at:
          default: now()
          description: "created "
          format: timestamp with time zone
          type: string
        title:
          description: Official name.
          format: text
          type: string
        citation:
          description: Legal reference.
          format: text
          type: string
        description:
          description: Summary and relevance.
          format: text
          type: string
        context:
          description: Full text or excerpt.
          format: text
          type: string
        issuing_authority:
          description: Government body.
          format: text
          type: string
        effective_date:
          description: Implementation date.
          format: date
          type: string
        compliance_data:
          description: "Procedural mandates, ideally structured as data using an ontology
            that includes facts (such as thresholds triggering processes),
            duties, and actors (e.g., FLINT frames). "
          format: json
        url:
          description: URL of legal reference (e.g. eCFR)
          format: text
          type: string
        other:
          description: "This jsonb field should be used for additional data structures as
            needed. "
          format: jsonb
        record_owner_agency:
          description: This is the owner of the original data, generally the authoritative
            data source.
          format: text
          type: string
